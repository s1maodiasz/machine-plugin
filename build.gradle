plugins {
    id 'java'
    id 'com.diffplug.spotless' version "6.25.0"
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.github.s1maodyasz'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven { url = "https://repo.nexomc.com/releases" }
    maven { url = "https://repo.codemc.io/repository/maven-releases/" }
    maven { url 'https://repo.aikar.co/content/groups/aikar/' }
}

dependencies {
    implementation('org.mongodb:mongodb-driver-sync:5.6.1')
    implementation('com.github.ben-manes.caffeine:caffeine:3.1.8')
    implementation 'co.aikar:acf-paper:0.5.1-SNAPSHOT'
    compileOnly('io.papermc.paper:paper-api:1.21.10-R0.1-SNAPSHOT')
    compileOnly('org.projectlombok:lombok:1.18.42')
    compileOnly("com.nexomc:nexo:1.16.1")
    compileOnly('io.github.toxicity188:bettermodel:1.15.1')
    annotationProcessor('org.projectlombok:lombok:1.18.42')
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

spotless {
    java {
        palantirJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.shadowJar {
    final folder = project.property("build.destination")
    destinationDirectory = file(folder)
}
